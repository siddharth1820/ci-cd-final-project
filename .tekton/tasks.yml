
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cleanup
spec:
  description: Clean the source workspace before running the pipeline.
  workspaces:
    - name: source
  steps:
    - name: remove-files
      image: alpine:3.20
      env:
        - name: WORKSPACE_SOURCE_PATH
          value: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        echo "Cleaning workspace: ${WORKSPACE_SOURCE_PATH}"
        find "${WORKSPACE_SOURCE_PATH}" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
        echo "Workspace cleanup completed"
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: nose
spec:
  description: Install dependencies and run Python unit tests using nose.
  workspaces:
    - name: source
  steps:
    - name: run-unit-tests
      image: python:3.11
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        python -m pip install --upgrade pip
        pip install nose
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        fi
        echo "Running unit tests with nose"
        nosetests
